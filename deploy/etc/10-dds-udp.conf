# FastDDS shared-memory transport does not deliver samples to NEW participants
# on this box: discovery succeeds (count_publishers reports the publisher) and
# then zero samples arrive. Diagnosed 2026-10-09 - it looks exactly like a dead
# rover, and cost a debug cycle chasing a healthy stack.
#
# UDPv4 only, everywhere, so publishers and any later tool agree on a transport
# that works. /dev/shm was NOT full (6.8M of 3.9G), so this is not a capacity
# problem and raising a limit would not fix it.
[Service]
Environment=FASTRTPS_DEFAULT_PROFILES_FILE=/etc/fpms/fastdds-udp-only.xml
